services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: influuntdev
      MYSQL_USER: influunt
      MYSQL_PASSWORD: influunt
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

  mongo:
    image: mongo:3.4
    command: ["mongod", "--bind_ip", "0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - mongo-data:/data/db

  mosquitto:
    build:
      context: ./docker/mosquitto
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -m ok >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "127.0.0.1:1883:1883"
      - "1884:1884"

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      INFLUUNT_URL: ${INFLUUNT_URL:-http://localhost:8080}
    working_dir: /workspace/influunt-api
    stdin_open: true
    tty: true
    command: ["/workspace/docker/api/run-api.sh"]
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/api/v1/permissoes/roles >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 15m
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ivy-cache:/root/.ivy2
      - sbt-cache:/root/.sbt
      - activator-cache:/root/.activator

  bootstrap:
    build:
      context: .
      dockerfile: docker/bootstrap/Dockerfile
    working_dir: /workspace
    command: ["/bin/bash", "/workspace/docker/bootstrap/bootstrap.sh"]
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_healthy
  web-setup:
    build:
      context: .
      dockerfile: docker/web-setup/Dockerfile
    working_dir: /workspace/influunt-app
    command: ["/bin/bash", "/workspace/docker/web-setup/setup-web.sh"]
    environment:
      LOCAL_APP_ROOT: /api/api/v1
      LOCAL_ENV_NAME: docker-local
      LOCAL_INFLUUNT_HOST: localhost
      LOCAL_MQTT_HOST: ${LOCAL_MQTT_HOST:-}
      LOCAL_MQTT_PORT: "${LOCAL_MQTT_PORT:-1884}"
    volumes:
      - frontend-workspace:/workspace/influunt-app

  web:
    build:
      context: ./docker/nginx
    depends_on:
      api:
        condition: service_healthy
      web-setup:
        condition: service_completed_successfully
    ports:
      - "8080:80"
    volumes:
      - frontend-workspace:/workspace/influunt-app:ro

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  mysql-data:
  mongo-data:
  ivy-cache:
  sbt-cache:
  activator-cache:
  frontend-workspace:
